<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج الثانوية العامة 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
        .header { background: #fff; border-bottom: 3px solid #1a73e8; padding: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .header h1 { text-align: center; font-size: 24px; font-weight: 600; color: #1a73e8; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        .page-tabs { display: flex; margin-bottom: 24px; border-radius: 10px; overflow: hidden; border: 2px solid #e0e0e0; background: #fff; }
        .page-tabs button { flex: 1; padding: 14px 20px; border: none; background: #f5f5f5; color: #666; font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .page-tabs button.active { background: #1a73e8; color: #fff; }
        .page-tabs button:hover:not(.active) { background: #e8eaed; }
        .page { display: none; }
        .page.active { display: block; }

        .search-card { background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .search-toggle { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 2px solid #e0e0e0; }
        .search-toggle button { flex: 1; padding: 12px 20px; border: none; background: #f5f5f5; color: #666; font-size: 16px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .search-toggle button.active { background: #1a73e8; color: #fff; font-weight: 600; }
        .search-input-wrapper { display: flex; gap: 12px; }
        .search-input-wrapper input { flex: 1; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; font-family: inherit; outline: none; transition: border-color 0.2s; direction: rtl; }
        .search-input-wrapper input:focus { border-color: #1a73e8; }
        .search-btn { padding: 14px 32px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit; white-space: nowrap; }
        .search-btn:hover { background: #1557b0; }
        .search-btn:disabled { background: #94baf7; cursor: not-allowed; }
        .loading { text-align: center; padding: 40px; color: #666; font-size: 16px; }
        .loading-sub { font-size: 13px; color: #999; margin-top: 8px; }
        .loading-bar { width: 260px; height: 6px; background: #e0e0e0; border-radius: 3px; margin: 16px auto 0; overflow: hidden; }
        .loading-bar-fill { height: 100%; background: #1a73e8; border-radius: 3px; transition: width 0.3s; width: 0%; }
        .results-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
        .result-header { background: #f5f7fa; padding: 16px 24px; border-bottom: 1px solid #e8eaed; font-size: 14px; color: #666; }
        .result-item { padding: 20px 24px; border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: #f8f9fa; }
        .result-item.zero-score { opacity: 0.5; }
        .result-name { font-size: 18px; font-weight: 600; color: #202124; margin-bottom: 8px; }
        .result-details { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; }
        .result-field { display: flex; align-items: center; gap: 6px; }
        .result-label { color: #666; }
        .result-value { font-weight: 600; color: #333; }
        .result-value.success { color: #0d904f; }
        .result-value.fail { color: #d93025; }
        .result-percentage { display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        .no-results { text-align: center; padding: 40px 24px; color: #666; font-size: 16px; }
        .error-msg { text-align: center; padding: 20px; color: #d93025; font-size: 14px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
        .stat-card.wide { grid-column: span 2; }
        .stat-number { font-size: 28px; font-weight: 700; color: #1a73e8; margin-bottom: 4px; }
        .stat-number.green { color: #0d904f; }
        .stat-number.red { color: #d93025; }
        .stat-label { font-size: 13px; color: #666; }
        .stat-sub { font-size: 12px; color: #999; margin-top: 2px; }

        .chart-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .chart-title { font-size: 17px; font-weight: 600; color: #202124; margin-bottom: 20px; }
        .chart-row { display: flex; align-items: center; margin-bottom: 12px; gap: 12px; }
        .chart-label { min-width: 180px; font-size: 12px; color: #666; text-align: left; white-space: nowrap; direction: ltr; }
        .chart-bar-bg { flex: 1; height: 28px; background: #f0f2f5; border-radius: 6px; overflow: hidden; position: relative; }
        .chart-bar { height: 100%; background: #1a73e8; border-radius: 6px; transition: width 0.6s ease; min-width: 2px; }
        .chart-bar.green { background: #0d904f; }
        .chart-bar.red { background: #d93025; }
        .chart-bar.orange { background: #e37400; }
        .chart-bar.yellow { background: #c4a700; }
        .chart-info { min-width: 140px; font-size: 13px; color: #333; text-align: right; white-space: nowrap; }
        .chart-info strong { color: #1a73e8; }

        .stats-loading { text-align: center; padding: 60px 20px; color: #666; font-size: 16px; }

        .footer { text-align: center; padding: 30px 20px; color: #999; font-size: 13px; }

        @media (max-width: 600px) {
            .header h1 { font-size: 18px; }
            .search-card { padding: 20px; }
            .search-input-wrapper { flex-direction: column; }
            .search-btn { width: 100%; }
            .result-details { flex-direction: column; gap: 8px; }
            .stats-grid { grid-template-columns: 1fr; }
            .stat-card.wide { grid-column: span 1; }
            .chart-label { min-width: 130px; font-size: 11px; }
            .chart-info { min-width: 100px; font-size: 12px; }
            .page-tabs button { font-size: 15px; padding: 12px 10px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>نتائج الثانوية العامة - الدور الأول 2026</h1>
    </div>
    <div class="container">
        <div class="page-tabs">
            <button id="tab-search" class="active" onclick="showPage('search')">بحث</button>
            <button id="tab-stats" onclick="showPage('stats')">إحصائيات</button>
        </div>

        <div id="page-search" class="page active">
            <div class="search-card">
                <div class="search-toggle">
                    <button id="btn-id" class="active" onclick="setMode('id')">رقم الجلوس</button>
                    <button id="btn-name" onclick="setMode('name')">الاسم</button>
                </div>
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="أدخل رقم الجلوس" inputmode="numeric">
                    <button class="search-btn" id="search-btn" onclick="doSearch()" disabled>بحث</button>
                </div>
            </div>
            <div id="results">
                <div class="loading">جاري تحميل البيانات...<div class="loading-sub">قد يستغرق هذا بضع ثوانٍ</div><div class="loading-bar"><div class="loading-bar-fill" id="load-bar"></div></div></div>
            </div>
        </div>

        <div id="page-stats" class="page">
            <div id="stats-content">
                <div class="stats-loading">جاري تحميل الإحصائيات...</div>
            </div>
        </div>
    </div>
    <div class="footer">نتائج الثانوية العامة 2026 - الدور الأول</div>

    <script>
        var students = [];
        var byId = {};
        var nameIndex = {};
        var mode = 'id';
        var ready = false;
        var statsComputed = false;

        var searchInput = document.getElementById('search-input');
        var resultsDiv = document.getElementById('results');
        var searchBtn = document.getElementById('search-btn');
        var loadBar = document.getElementById('load-bar');

        (function loadData() {
            fetch('chunks/manifest.json')
                .then(function(r) { return r.json(); })
                .then(function(manifest) {
                    var total = manifest.length;
                    var loaded = 0;
                    var promises = manifest.map(function(chunk) {
                        return fetch('chunks/' + chunk.file)
                            .then(function(r) { return r.json(); })
                            .then(function(data) {
                                for (var i = 0; i < data.length; i++) {
                                    var idx = students.length;
                                    byId[data[i][0]] = idx;
                                    var words = data[i][1].toLowerCase().split(/\s+/);
                                    for (var w = 0; w < words.length; w++) {
                                        var word = words[w];
                                        if (word.length < 2) continue;
                                        if (!nameIndex[word]) nameIndex[word] = [];
                                        nameIndex[word].push(idx);
                                    }
                                    students.push(data[i]);
                                }
                                loaded++;
                                loadBar.style.width = Math.round((loaded / total) * 100) + '%';
                            });
                    });
                    Promise.all(promises).then(function() {
                        ready = true;
                        searchBtn.disabled = false;
                        resultsDiv.innerHTML = '';
                    });
                })
                .catch(function() {
                    resultsDiv.innerHTML = '<div class="error-msg">حدث خطأ في تحميل البيانات</div>';
                });
        })();

        function showPage(page) {
            document.getElementById('tab-search').classList.toggle('active', page === 'search');
            document.getElementById('tab-stats').classList.toggle('active', page === 'stats');
            document.getElementById('page-search').classList.toggle('active', page === 'search');
            document.getElementById('page-stats').classList.toggle('active', page === 'stats');
            if (page === 'stats' && ready && !statsComputed) {
                computeStats();
            }
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btn-id').classList.toggle('active', m === 'id');
            document.getElementById('btn-name').classList.toggle('active', m === 'name');
            searchInput.placeholder = m === 'id' ? 'أدخل رقم الجلوس' : 'أدخل الاسم';
            searchInput.inputMode = m === 'id' ? 'numeric' : 'text';
            searchInput.value = '';
            resultsDiv.innerHTML = '';
        }

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        function doSearch() {
            if (!ready) return;
            var q = searchInput.value.trim();
            if (!q) { resultsDiv.innerHTML = ''; return; }
            if (mode === 'id') searchById(q);
            else searchByName(q);
        }

        function searchById(q) {
            var id = parseInt(q, 10);
            if (isNaN(id)) {
                resultsDiv.innerHTML = '<div class="no-results">يرجى إدخال رقم جلوس صحيح</div>';
                return;
            }
            var idx = byId[id];
            if (idx === undefined) {
                resultsDiv.innerHTML = '<div class="no-results">لم يتم العثور على نتيجة لهذا الرقم</div>';
                return;
            }
            renderResults([students[idx]], true);
        }

        function searchByName(q) {
            var words = q.toLowerCase().split(/\s+/).filter(function(w) { return w.length >= 2; });
            if (words.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">يرجى إدخال اسم صحيح</div>';
                return;
            }

            var candidates = null;
            for (var w = 0; w < words.length; w++) {
                var wordList = nameIndex[words[w]];
                if (!wordList) {
                    resultsDiv.innerHTML = '<div class="no-results">لم يتم العثور على نتائج لهذا الاسم</div>';
                    return;
                }
                if (candidates === null || wordList.length < candidates.length) {
                    candidates = wordList;
                }
            }

            var matches = [];
            var seen = {};
            for (var i = 0; i < candidates.length; i++) {
                var idx = candidates[i];
                if (seen[idx]) continue;
                var name = students[idx][1].toLowerCase();
                var allMatch = true;
                for (var w = 0; w < words.length; w++) {
                    if (name.indexOf(words[w]) === -1) {
                        allMatch = false;
                        break;
                    }
                }
                if (allMatch) {
                    seen[idx] = true;
                    matches.push(students[idx]);
                    if (matches.length >= 500) break;
                }
            }

            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">لم يتم العثور على نتائج لهذا الاسم</div>';
                return;
            }

            matches.sort(function(a, b) { return b[2] - a[2]; });
            renderResults(matches, false);
        }

        function renderResults(list, single) {
            var pct = function(score) { return ((score / 320) * 100).toFixed(1); };
            var statusClass = function(s) { return s.indexOf('ناجح') !== -1 ? 'success' : 'fail'; };

            var html = '<div class="results-card">';
            html += '<div class="result-header">عدد النتائج: ' + list.length + '</div>';

            for (var i = 0; i < list.length; i++) {
                var s = list[i];
                var isZero = s[2] === 0;
                html += '<div class="result-item' + (isZero ? ' zero-score' : '') + '">';
                html += '<div class="result-name">' + escHtml(s[1]) + '</div>';
                html += '<div class="result-details">';
                html += '<div class="result-field"><span class="result-label">رقم الجلوس:</span><span class="result-value">' + s[0] + '</span></div>';
                html += '<div class="result-field"><span class="result-label">الدرجة:</span><span class="result-value">' + s[2] + ' / 320</span></div>';
                html += '<div class="result-field"><span class="result-percentage">' + pct(s[2]) + '%</span></div>';
                html += '<div class="result-field"><span class="result-label">الحالة:</span><span class="result-value ' + statusClass(s[3]) + '">' + escHtml(s[3]) + '</span></div>';
                html += '</div></div>';
            }

            html += '</div>';
            resultsDiv.innerHTML = html;
        }

        function computeStats() {
            var n = students.length;
            var sum = 0;
            var passCount = 0;
            var failCount = 0;
            var maxScore = 0;
            var scores = [];

            for (var i = 0; i < n; i++) {
                var score = students[i][2];
                scores.push(score);
                sum += score;
                if (score > maxScore) maxScore = score;
                if (students[i][3].indexOf('ناجح') !== -1) passCount++;
                else failCount++;
            }

            scores.sort(function(a, b) { return a - b; });
            var median = (n % 2 === 0)
                ? (scores[n / 2 - 1] + scores[n / 2]) / 2
                : scores[Math.floor(n / 2)];
            var mean = sum / n;

            var bands = [
                { label: '0 / 320', min: 0, max: 0, color: 'red' },
                { label: '1 - 160 / 320 (1%-50%)', min: 0.01, max: 160, color: 'red' },
                { label: '161 - 192 / 320 (50%-60%)', min: 160.01, max: 192, color: 'orange' },
                { label: '193 - 224 / 320 (60%-70%)', min: 192.01, max: 224, color: 'yellow' },
                { label: '225 - 256 / 320 (70%-80%)', min: 224.01, max: 256, color: '' },
                { label: '257 - 288 / 320 (80%-90%)', min: 256.01, max: 288, color: '' },
                { label: '289 - 304 / 320 (90%-95%)', min: 288.01, max: 304, color: 'green' },
                { label: '305 - 320 / 320 (95%-100%)', min: 304.01, max: 320, color: 'green' }
            ];

            for (var b = 0; b < bands.length; b++) bands[b].count = 0;
            for (var i = 0; i < n; i++) {
                var s = students[i][2];
                for (var b = 0; b < bands.length; b++) {
                    if (s >= bands[b].min && s <= bands[b].max) {
                        bands[b].count++;
                        break;
                    }
                }
            }

            var maxBandCount = 0;
            for (var b = 0; b < bands.length; b++) {
                if (bands[b].count > maxBandCount) maxBandCount = bands[b].count;
            }

            var pctOf = function(val) { return ((val / n) * 100).toFixed(1); };
            var fmt = function(val) { return val.toLocaleString('en'); };

            var html = '';
            html += '<div class="stats-grid">';
            html += '<div class="stat-card"><div class="stat-number">' + fmt(n) + '</div><div class="stat-label">إجمالي الطلاب</div></div>';
            html += '<div class="stat-card"><div class="stat-number green">' + fmt(passCount) + '</div><div class="stat-label">ناجح</div><div class="stat-sub">' + pctOf(passCount) + '%</div></div>';
            html += '<div class="stat-card"><div class="stat-number red">' + fmt(failCount) + '</div><div class="stat-label">راسب</div><div class="stat-sub">' + pctOf(failCount) + '%</div></div>';
            html += '<div class="stat-card"><div class="stat-number">' + mean.toFixed(1) + '</div><div class="stat-label">المتوسط (Mean)</div><div class="stat-sub">' + ((mean / 320) * 100).toFixed(1) + '% / 320</div></div>';
            html += '<div class="stat-card"><div class="stat-number">' + median.toFixed(1) + '</div><div class="stat-label">الوسيط (Median)</div><div class="stat-sub">' + ((median / 320) * 100).toFixed(1) + '% / 320</div></div>';
            html += '<div class="stat-card"><div class="stat-number">' + maxScore.toFixed(1) + '</div><div class="stat-label">أعلى درجة</div><div class="stat-sub">' + ((maxScore / 320) * 100).toFixed(1) + '% / 320</div></div>';
            html += '</div>';

            html += '<div class="chart-card">';
            html += '<div class="chart-title">توزيع الدرجات</div>';
            for (var b = 0; b < bands.length; b++) {
                var band = bands[b];
                var barWidth = maxBandCount > 0 ? Math.max((band.count / maxBandCount) * 100, 0.5) : 0.5;
                var barClass = band.color ? ' ' + band.color : '';
                html += '<div class="chart-row">';
                html += '<div class="chart-label">' + band.label + '</div>';
                html += '<div class="chart-bar-bg"><div class="chart-bar' + barClass + '" style="width:' + barWidth + '%"></div></div>';
                html += '<div class="chart-info"><strong>' + fmt(band.count) + '</strong> طالب (' + pctOf(band.count) + '%)</div>';
                html += '</div>';
            }
            html += '</div>';

            document.getElementById('stats-content').innerHTML = html;
            statsComputed = true;
        }

        function escHtml(s) {
            var d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
    </script>
</body>
</html>
